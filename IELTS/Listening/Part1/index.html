<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Listening Part 1 Practice</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f7fb;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{width:min(1120px,calc(100% - 32px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between}
.home{text-decoration:none;color:#374151;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:900}
.hero{padding:44px 0 24px}.kicker{font-size:12px;color:var(--blue);font-weight:900;text-transform:uppercase}.hero h1{font-size:38px;margin:7px 0 10px}.hero p{margin:0;color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:54px}.card{text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:48px 1fr 24px;gap:13px;align-items:center}.card:hover{border-color:#bfdbfe;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.num{width:44px;height:44px;border-radius:12px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-size:12px;font-weight:950}.card strong{display:block;font-size:16px;margin-bottom:5px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.arrow{color:#9ca3af;font-size:18px}.loading{grid-column:1/-1;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap top"><div><strong>IELTS Listening Practice</strong><div style="color:#6b7280;font-size:12px;margin-top:3px">Part 1</div></div><a class="home" href="../../">← Quay lại trang chủ</a></div></header>
<main class="wrap"><section class="hero"><div class="kicker">Listening · Part 1</div><h1>Listening Part 1 Practice</h1><p>Danh sách bài luyện Part 1 được cập nhật tự động. Sau này chỉ cần tạo thêm folder 02, 03, 04...; không cần sửa trang danh sách.</p></section>
<section class="grid" id="grid"><div class="loading">Đang tải danh sách bài...</div></section></main>
<script>
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function probe(i){
  const folder=String(i).padStart(2,"0"),url=`./${folder}/index.html`;
  try{
    const r=await fetch(url,{cache:"no-store"});if(!r.ok)return null;
    const t=await r.text();if(!/<html[\s>]/i.test(t))return null;
    const d=new DOMParser().parseFromString(t,"text/html");
    const h=d.querySelector("main h1,h1");
    const title=h?h.textContent.trim():`Listening Part 1 Practice ${folder}`;
    const body=d.body.textContent.toLowerCase();
    const bits=["10 câu"];
    if(body.includes("table completion"))bits.push("Table Completion");
    if(body.includes("note completion"))bits.push("Note Completion");
    return {folder,title,summary:bits.join(" · "),url:`./${folder}/`};
  }catch(e){return null}
}
(async()=>{
  const grid=document.getElementById("grid");
  const found=(await Promise.all(Array.from({length:50},(_,i)=>probe(i+1)))).filter(Boolean);
  grid.innerHTML="";
  if(!found.length){grid.innerHTML='<div class="loading">Chưa có bài luyện.</div>';return}
  found.forEach(x=>{
    const a=document.createElement("a");a.className="card";a.href=x.url;
    a.innerHTML=`<span class="num">${x.folder}</span><div><strong>${esc(x.title)}</strong><p>${esc(x.summary)}</p></div><span class="arrow">→</span>`;
    grid.appendChild(a);
  });
})();
</script></body></html>
