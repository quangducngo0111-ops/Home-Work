<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smartcom – Homework</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#eff6ff;
  --success:#16a34a;--success-light:#f0fdf4;
  --danger:#dc2626;--danger-light:#fef2f2;
  --warning:#d97706;--warning-light:#fffbeb;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-400:#9ca3af;--gray-600:#4b5563;--gray-800:#1f2937;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh}

/* ── Header ── */
.header{background:var(--primary);color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-md)}
.header-logo{width:36px;height:36px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary);font-size:14px}
.header h1{font-size:16px;font-weight:600}
.header p{font-size:12px;opacity:.85}

/* ── Screens ── */
.screen{display:none;max-width:680px;margin:0 auto;padding:1.5rem 1rem}
.screen.active{display:block}

/* ── Login card ── */
.login-card{background:#fff;border-radius:14px;padding:2rem;box-shadow:var(--shadow-md);margin-top:2rem}
.login-card h2{font-size:20px;font-weight:600;margin-bottom:0.25rem}
.login-card p{font-size:13px;color:var(--gray-600);margin-bottom:1.5rem}
.field{margin-bottom:1.25rem}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--gray-600)}
.field input,.field select{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-size:14px;outline:none;transition:border .15s;background:#fff}
.field input:focus,.field select:focus{border-color:var(--primary)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:var(--gray-400);cursor:not-allowed}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-outline:hover{background:var(--primary-light)}

/* ── Quiz header ── */
.quiz-topbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:0.75rem 1rem;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.quiz-topbar .student-info{font-size:13px;color:var(--gray-600)}
.quiz-topbar .student-info strong{color:var(--gray-800)}
.timer{font-size:14px;font-weight:600;color:var(--primary);background:var(--primary-light);padding:4px 12px;border-radius:20px}

/* ── Progress bar ── */
.progress-wrap{background:var(--gray-100);border-radius:999px;height:6px;margin:1rem 0}
.progress-bar{height:6px;background:var(--primary);border-radius:999px;transition:width .3s}
.progress-label{font-size:12px;color:var(--gray-400);margin-bottom:4px}

/* ── Question card ── */
.question-card{background:#fff;border-radius:14px;padding:1.5rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.q-number{font-size:11px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.q-type-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;margin-left:6px;font-weight:500}
.badge-mc{background:#ede9fe;color:#6d28d9}
.badge-fill{background:#fef3c7;color:#92400e}
.q-text{font-size:15px;line-height:1.6;margin-bottom:1.25rem;color:var(--gray-800)}

/* MC options */
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:all .15s;font-size:14px}
.option:hover{border-color:var(--primary);background:var(--primary-light)}
.option.selected{border-color:var(--primary);background:var(--primary-light);font-weight:500}
.option.correct{border-color:var(--success);background:var(--success-light);color:var(--success)}
.option.wrong{border-color:var(--danger);background:var(--danger-light);color:var(--danger)}
.option-label{width:24px;height:24px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.option.selected .option-label{background:var(--primary);color:#fff}
.option.correct .option-label{background:var(--success);color:#fff}
.option.wrong .option-label{background:var(--danger);color:#fff}

/* Fill input */
.fill-wrap{display:flex;flex-direction:column;gap:8px}
.fill-wrap input{padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-size:14px;outline:none;transition:border .15s}
.fill-wrap input:focus{border-color:var(--primary)}
.fill-wrap input.correct{border-color:var(--success);background:var(--success-light)}
.fill-wrap input.wrong{border-color:var(--danger);background:var(--danger-light)}
.hint-text{font-size:12px;color:var(--gray-400);font-style:italic}

/* Feedback */
.feedback{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.feedback.correct{background:var(--success-light);color:var(--success);border-left:3px solid var(--success)}
.feedback.wrong{background:var(--danger-light);color:var(--danger);border-left:3px solid var(--danger)}
.feedback.show{display:block}

/* Navigation */
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:12px}
.q-dots{display:flex;flex-wrap:wrap;gap:5px}
.q-dot{width:28px;height:28px;border-radius:50%;background:var(--gray-200);border:none;cursor:pointer;font-size:11px;font-weight:600;color:var(--gray-600);transition:all .15s}
.q-dot.answered{background:var(--primary);color:#fff}
.q-dot.current{ring:2px solid var(--primary);outline:2px solid var(--primary);outline-offset:2px}

/* Submit button */
.submit-wrap{text-align:center;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--gray-200)}

/* ── Result screen ── */
.result-card{background:#fff;border-radius:14px;padding:2rem;box-shadow:var(--shadow-md);margin-top:1.5rem;text-align:center}
.score-circle{width:110px;height:110px;border-radius:50%;margin:0 auto 1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:700;border:5px solid}
.score-circle.great{border-color:var(--success);color:var(--success);background:var(--success-light)}
.score-circle.ok{border-color:var(--warning);color:var(--warning);background:var(--warning-light)}
.score-circle.low{border-color:var(--danger);color:var(--danger);background:var(--danger-light)}
.score-circle span{font-size:12px;font-weight:400}
.result-name{font-size:18px;font-weight:600;margin-bottom:4px}
.result-class{font-size:13px;color:var(--gray-600);margin-bottom:1.5rem}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.stat-box{background:var(--gray-50);border-radius:10px;padding:12px;border:1px solid var(--gray-200)}
.stat-val{font-size:22px;font-weight:700;color:var(--gray-800)}
.stat-label{font-size:11px;color:var(--gray-400);margin-top:2px}
.review-list{text-align:left;margin-top:1.5rem}
.review-item{padding:12px;border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.5}
.review-item.correct{background:var(--success-light);border-left:3px solid var(--success)}
.review-item.wrong{background:var(--danger-light);border-left:3px solid var(--danger)}
.review-q{font-weight:500;margin-bottom:4px}
.review-ans{color:var(--gray-600)}
.status-msg{margin-top:1rem;font-size:13px;padding:8px 12px;border-radius:8px}
.status-msg.sending{background:#eff6ff;color:var(--primary)}
.status-msg.sent{background:var(--success-light);color:var(--success)}
.status-msg.error{background:var(--danger-light);color:var(--danger)}

@media(max-width:480px){
  .result-stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-val{font-size:18px}
  .q-dots{gap:4px}
  .q-dot{width:24px;height:24px;font-size:10px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">SC</div>
  <div>
    <h1>Smartcom English</h1>
    <p>IELTS Homework System</p>
  </div>
</div>

<!-- ══ LOGIN SCREEN ══ -->
<div class="screen active" id="screen-login">
  <div class="login-card">
    <h2>Làm bài tập về nhà 📚</h2>
    <p>Nhập thông tin để bắt đầu</p>

    <div class="field">
      <label>Họ và tên</label>
      <input type="text" id="inp-name" placeholder="Nguyễn Văn A" autocomplete="name"/>
    </div>
    <div class="field">
      <label>Lớp</label>
      <select id="inp-class">
        <option value="">-- Chọn lớp --</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">Bắt đầu làm bài →</button>
  </div>
</div>

<!-- ══ QUIZ SCREEN ══ -->
<div class="screen" id="screen-quiz">
  <div class="quiz-topbar">
    <div class="student-info">
      <strong id="display-name"></strong><br>
      <span id="display-class"></span>
    </div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div style="padding:0 0 1rem">
    <div class="progress-label" id="progress-label">Câu 1 / 5</div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <div class="q-dots" id="q-dots"></div>
  </div>

  <div id="question-area"></div>

  <div class="nav-bar">
    <button class="btn btn-outline" onclick="prevQ()" id="btn-prev">← Trước</button>
    <button class="btn btn-primary" onclick="nextQ()" id="btn-next" style="flex:1">Tiếp theo →</button>
  </div>

  <div class="submit-wrap">
    <button class="btn btn-primary" id="btn-submit" onclick="submitQuiz()" style="display:none;background:#16a34a">
      ✅ Nộp bài
    </button>
  </div>
</div>

<!-- ══ RESULT SCREEN ══ -->
<div class="screen" id="screen-result">
  <div class="result-card">
    <div class="score-circle" id="score-circle">
      <span id="score-display">0/5</span>
      <span id="pct-display">0%</span>
    </div>
    <div class="result-name" id="result-name"></div>
    <div class="result-class" id="result-class"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="stat-val" id="stat-correct">0</div><div class="stat-label">Câu đúng</div></div>
      <div class="stat-box"><div class="stat-val" id="stat-wrong">0</div><div class="stat-label">Câu sai</div></div>
      <div class="stat-box"><div class="stat-val" id="stat-time">0s</div><div class="stat-label">Thời gian</div></div>
    </div>
    <div class="status-msg sending" id="status-msg">⏳ Đang gửi kết quả lên Google Sheets...</div>
    <div class="review-list" id="review-list"></div>
    <button class="btn btn-outline" style="margin-top:1.5rem;width:100%" onclick="resetQuiz()">🔄 Làm lại</button>
  </div>
</div>

<script src="questions.js"></script>
<script>
// ── Config ──────────────────────────────────────────────────
// Dán URL Apps Script của bạn vào đây sau khi deploy
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_bFg85qQtIZrgFGJcNkSWBOohY_2mI-PNCBRocprRC2cjrjJKPZWK-6xBQlytqmgmfw/exec";

// ── State ────────────────────────────────────────────────────
let studentName = "", studentClass = "";
let currentQ = 0;
let answers = {}; // {id: userAnswer}
let timerInterval = null;
let elapsed = 0;
let submitted = false;

// ── Init ─────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", ()=>{
  const sel = document.getElementById("inp-class");
  CLASSES.forEach(c=>{
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
});

// ── Login ─────────────────────────────────────────────────────
function startQuiz(){
  studentName  = document.getElementById("inp-name").value.trim();
  studentClass = document.getElementById("inp-class").value;
  if(!studentName){ alert("Vui lòng nhập họ tên!"); return; }
  if(!studentClass){ alert("Vui lòng chọn lớp!"); return; }

  document.getElementById("display-name").textContent  = studentName;
  document.getElementById("display-class").textContent = studentClass;
  document.getElementById("result-name").textContent   = studentName;
  document.getElementById("result-class").textContent  = studentClass;

  showScreen("screen-quiz");
  buildDots();
  renderQuestion();
  startTimer();
}

// ── Timer ─────────────────────────────────────────────────────
function startTimer(){
  elapsed = 0;
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    elapsed++;
    const m = String(Math.floor(elapsed/60)).padStart(2,"0");
    const s = String(elapsed%60).padStart(2,"0");
    document.getElementById("timer").textContent = `${m}:${s}`;
  }, 1000);
}

// ── Dots ──────────────────────────────────────────────────────
function buildDots(){
  const wrap = document.getElementById("q-dots");
  wrap.innerHTML = "";
  QUESTIONS.forEach((q,i)=>{
    const btn = document.createElement("button");
    btn.className = "q-dot" + (i===0?" current":"");
    btn.id = `dot-${i}`;
    btn.textContent = i+1;
    btn.onclick = ()=>{ currentQ=i; renderQuestion(); };
    wrap.appendChild(btn);
  });
}

function updateDots(){
  QUESTIONS.forEach((_,i)=>{
    const d = document.getElementById(`dot-${i}`);
    d.className = "q-dot"
      + (answers[QUESTIONS[i].id] !== undefined ? " answered":"")
      + (i===currentQ ? " current":"");
  });
}

// ── Render question ───────────────────────────────────────────
function renderQuestion(){
  const q = QUESTIONS[currentQ];
  const area = document.getElementById("question-area");
  const total = QUESTIONS.length;

  document.getElementById("progress-label").textContent = `Câu ${currentQ+1} / ${total}`;
  document.getElementById("progress-bar").style.width = `${((currentQ+1)/total)*100}%`;
  document.getElementById("btn-prev").disabled = currentQ === 0;
  document.getElementById("btn-next").style.display = currentQ < total-1 ? "" : "none";
  document.getElementById("btn-submit").style.display = currentQ === total-1 ? "" : "none";

  const typeBadge = q.type === "mc"
    ? `<span class="q-type-badge badge-mc">Trắc nghiệm</span>`
    : `<span class="q-type-badge badge-fill">Điền từ</span>`;

  let bodyHTML = "";
  if(q.type === "mc"){
    const saved = answers[q.id];
    bodyHTML = `<div class="options">${q.options.map(opt=>{
      const letter = opt.split(".")[0].trim();
      const isSel  = saved === letter;
      return `<div class="option${isSel?" selected":""}" onclick="selectMC(${q.id},'${letter}',this)">
        <div class="option-label">${letter}</div>
        <span>${opt.substring(2).trim()}</span>
      </div>`;
    }).join("")}</div>`;
  } else {
    const saved = answers[q.id] || "";
    bodyHTML = `<div class="fill-wrap">
      <input type="text" id="fill-${q.id}" value="${saved}"
        placeholder="Nhập câu trả lời..."
        oninput="saveFill(${q.id},this.value)"
        ${submitted?"disabled":""}/>
      ${q.hint ? `<span class="hint-text">💡 Gợi ý: ${q.hint}</span>` : ""}
    </div>`;
  }

  const fbClass  = submitted ? (isCorrect(q) ? "correct show" : "wrong show") : "";
  const fbText   = submitted ? (isCorrect(q)
    ? `✅ Chính xác! ${q.explanation}`
    : `❌ Đáp án đúng: <strong>${q.answer}</strong>. ${q.explanation}`) : "";

  area.innerHTML = `
    <div class="question-card">
      <div class="q-number">Câu ${currentQ+1} ${typeBadge}</div>
      <div class="q-text">${q.question}</div>
      ${bodyHTML}
      <div class="feedback ${fbClass}" id="fb-${q.id}">${fbText}</div>
    </div>`;

  updateDots();
}

// ── Answer handlers ───────────────────────────────────────────
function selectMC(id, letter, el){
  if(submitted) return;
  answers[id] = letter;
  el.closest(".options").querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
  el.classList.add("selected");
  el.querySelector(".option-label").style.background = "var(--primary)";
  el.querySelector(".option-label").style.color = "#fff";
  updateDots();
}

function saveFill(id, val){
  answers[id] = val.trim();
  updateDots();
}

function prevQ(){ if(currentQ>0){ currentQ--; renderQuestion(); } }
function nextQ(){ if(currentQ<QUESTIONS.length-1){ currentQ++; renderQuestion(); } }

// ── Correct check ─────────────────────────────────────────────
function isCorrect(q){
  const a = answers[q.id];
  if(!a) return false;
  if(q.type==="mc") return a === q.answer;
  return a.toLowerCase().trim() === q.answer.toLowerCase().trim();
}

// ── Submit ────────────────────────────────────────────────────
function submitQuiz(){
  if(!confirm("Bạn có chắc muốn nộp bài?")) return;
  clearInterval(timerInterval);
  submitted = true;

  const correct = QUESTIONS.filter(q=>isCorrect(q)).length;
  const total   = QUESTIONS.length;
  const pct     = Math.round((correct/total)*100);

  // Result screen
  const circle = document.getElementById("score-circle");
  circle.className = "score-circle " + (pct>=80?"great":pct>=50?"ok":"low");
  document.getElementById("score-display").textContent = `${correct}/${total}`;
  document.getElementById("pct-display").textContent   = `${pct}%`;
  document.getElementById("stat-correct").textContent  = correct;
  document.getElementById("stat-wrong").textContent    = total - correct;
  document.getElementById("stat-time").textContent     = formatTime(elapsed);

  // Review
  const rev = document.getElementById("review-list");
  rev.innerHTML = "<strong style='font-size:14px'>Chi tiết từng câu:</strong><br><br>"
    + QUESTIONS.map((q,i)=>{
      const ok = isCorrect(q);
      const ua = answers[q.id] || "(chưa trả lời)";
      return `<div class="review-item ${ok?"correct":"wrong"}">
        <div class="review-q">${i+1}. ${q.question}</div>
        <div class="review-ans">
          Bạn trả lời: <strong>${ua}</strong>${!ok?` | Đáp án đúng: <strong>${q.answer}</strong>`:""}<br>
          <em style="font-size:12px">${q.explanation}</em>
        </div>
      </div>`;
    }).join("");

  showScreen("screen-result");
  sendToSheets(correct, total, pct);
}

// ── Send to Google Sheets ─────────────────────────────────────
function sendToSheets(correct, total, pct){
  const msg = document.getElementById("status-msg");
  msg.className = "status-msg sending";
  msg.textContent = "⏳ Đang gửi kết quả lên Google Sheets...";

  const answersStr = JSON.stringify(
    QUESTIONS.map(q=>({ id:q.id, answer: answers[q.id]||"", correct: isCorrect(q) }))
  );

  const params = new URLSearchParams({
    action: "submit",
    studentName,
    className: studentClass,
    score: correct,
    total,
    timeTaken: elapsed,
    answers: answersStr
  });

  // Use no-cors fetch (Apps Script CORS can be tricky)
  fetch(`${APPS_SCRIPT_URL}?${params.toString()}`, { method:"GET", mode:"no-cors" })
    .then(()=>{
      msg.className = "status-msg sent";
      msg.textContent = "✅ Kết quả đã được lưu vào Google Sheets!";
    })
    .catch(()=>{
      msg.className = "status-msg error";
      msg.textContent = "⚠️ Không thể kết nối. Vui lòng kiểm tra URL Apps Script.";
    });
}

// ── Helpers ───────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function formatTime(s){
  const m = Math.floor(s/60);
  return m>0 ? `${m}p ${s%60}s` : `${s}s`;
}

function resetQuiz(){
  answers  = {};
  currentQ = 0;
  submitted = false;
  elapsed  = 0;
  showScreen("screen-login");
}
</script>
</body>
</html>
